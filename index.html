<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Collider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--lets do this small project!!!!!!!!-->
    <div id="game-container">
        <div class="hud">
            <div id="score-display">SCORE: 0000</div><!--I need to press caps lock many times now lol-->
            <div id="lives-display">LIVES: 3</div>
        </div>

        <canvas id="game-canvas" width="800" height="600"></canvas>

        <div id="ui-layer">
            <div id="start-screen">
                <h1>Chaos Collider</h1>
                <p>DESTROY THOSE BOXES AND COLLECT POINTS AND ENJOY.</p>
                <button id="start-button">Start your mission?</button>
            </div>
            <div id="game-over" class="hidden">
                <h1>GAME OVER</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">Try Again?</button>
            </div>
        </div>
    </div>
    <div class="footer">
        MOVE THAT THING YOU HAVE IN YOUR HAND MOUSE TO MOVE, CLICK TO RELEASE THE BALL AND ENJOY!!!!!
    </div>


    <script src="script.js"></script>
</body>
</html>
